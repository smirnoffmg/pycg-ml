[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycg-ml"
version = "0.1.0"
description = "ML-aware call graphs for Python: a fork of PyCG with feature-engineering and estimator patterns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["packaging>=24"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.scripts]
pycg-ml = "pycg_ml.__main__:main"
mpfi = "pycg_ml.mpfi:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
# Benchmark snippets are analyser input: their exact syntax is the fixture.
exclude = ["micro-benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
mypy_path = "src"
packages = ["pycg_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]
